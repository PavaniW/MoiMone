# Netlify config for the backend. In the Netlify UI, set Base directory = "backend"
# so this file is picked up. No build step is needed (Node functions only).
[build]
  functions = "netlify/functions"
  command = ""
  publish = "."

# Route every request to the Express function (serverless-http preserves the path).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
